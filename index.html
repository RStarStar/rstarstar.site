<!DOCTYPE html>
<html lang="en" style="margin: 0; padding: 0; box-sizing: border-box; height: 100%;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
</head>
<body style="margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #e0eafc, #cfdef3); height: 100vh; display: flex; justify-content: center; align-items: center;">

    <div style="background: #ffffff; padding: 2.5rem 4rem; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); text-align: center; transition: transform 0.2s;">
        <h1 style="color: #333333; margin: 0 0 0.5rem 0; font-size: 2.5rem; font-weight: 700; letter-spacing: -0.5px;">
            Hello World
        </h1>
        <p style="color: #666666; margin: 0; font-size: 1.1rem; font-weight: 400;">
            Welcome to your beautiful new webpage.
        </p>
    </div>

</body>
</html>
